server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Reverse-proxy API calls to the Node service inside the compose network.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        client_max_body_size 150m;
    }
}
