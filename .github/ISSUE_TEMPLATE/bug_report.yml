name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which tool/page?
      options:
        - Merge & Organize
        - Split
        - Edit PDF (visual editor)
        - PDF to Word
        - Word to PDF
        - PDF to Images
        - Images to PDF
        - Watermark
        - Page Numbers
        - Compress
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Upload '...'
        3. Click '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Deployment: local dev / Docker Compose / Vercel
        - Browser + OS:
        - Node/Python version (if self-hosting):
    validations:
      required: false
