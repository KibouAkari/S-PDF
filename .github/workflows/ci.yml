name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Build & type-check (web + api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --workspaces
      - run: npm run build -w apps/api
      - run: npm run build -w apps/web

  converter:
    name: Converter service (import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/converter/requirements.txt
      - run: python -c "import sys; sys.path.insert(0, 'services/converter'); import main"
